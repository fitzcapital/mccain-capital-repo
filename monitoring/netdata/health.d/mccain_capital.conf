alarm: mccain_gamma_stale
   on: mccain_capital.gamma
class: Errors
 type: Application
component: Market Pulse Gamma
 calc: $gamma_stale
units: state
every: 10s
 warn: $this >= 1
delay: up 30s down 20s
summary: Market Pulse Gamma is stale
 info: Gamma exceeded its freshness threshold; execution remains locked on last-good data.
   to: silent

alarm: mccain_gamma_refresh_failed
   on: mccain_capital.gamma
class: Errors
 type: Application
component: Market Pulse Gamma
 calc: $gamma_refresh_failed
units: state
every: 10s
 crit: $this >= 1
delay: up 20s down 20s
summary: Market Pulse Gamma refresh failed
 info: The latest Gamma refresh failed; inspect Market Pulse diagnostics for the concise cause.
   to: silent

alarm: mccain_worker_thread_pressure
   on: mccain_capital.worker_resources
class: Errors
 type: System
component: Market Pulse Workers
 calc: $worker_pressure
units: state
every: 10s
 warn: $this == 1
 crit: $this >= 2
delay: up 20s down 30s
summary: Market Pulse worker task pressure
 info: Container tasks crossed the configured warning or critical threshold before exhaustion.
   to: silent
