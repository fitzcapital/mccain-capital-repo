name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (black)
        run: python -m black --check --config pyproject.toml .

  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run migrations (idempotency guard)
        run: |
          python migrate.py
          python migrate.py

      - name: Run tests
        run: python -m pytest -q

  container-build-and-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t mccain-capital-app:ci -f Containerfile .

      - name: Smoke test container endpoints
        run: |
          docker run -d --name mccain-capital-smoke -p 5001:5001 mccain-capital-app:ci
          ready=0
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:5001/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 120 mccain-capital-smoke
            exit 1
          fi
          for path in /dashboard /journal /analytics; do
            ok=0
            for i in 1 2 3 4 5; do
              if curl -fsS "http://127.0.0.1:5001${path}" >/dev/null; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "Smoke endpoint failed: ${path}"
              docker logs --tail 120 mccain-capital-smoke
              exit 1
            fi
          done
          docker logs --tail 80 mccain-capital-smoke
          docker rm -f mccain-capital-smoke

  deploy-guardrails:
    runs-on: ubuntu-latest
    needs: container-build-and-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Guardrail summary
        run: |
          echo "Deploy guardrails passed:"
          echo "- main branch push"
          echo "- lint + format checks"
          echo "- migrations executed twice (idempotent)"
          echo "- tests green"
          echo "- container smoke checks green"
